services:
  bot:
    build: .
    image: analysis-for-invest-bot
    container_name: analysis_for_invest_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      autoheal: "true"

  # Раскомментируй, чтобы контейнер сам перезапускался, если healthcheck
  # покажет «завис» (обычный restart: unless-stopped на unhealthy не реагирует).
